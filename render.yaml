services:
  - type: web
    name: artisafesight-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node --max-old-space-size=300 server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
